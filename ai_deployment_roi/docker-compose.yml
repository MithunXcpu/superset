# Local demo only. The passwords and secret below are for this compose
# project on a laptop. Do not reuse them anywhere else.

name: ai-deployment-roi

services:
  ai-roi-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_roi
      POSTGRES_PASSWORD: ai_roi_demo
      POSTGRES_DB: ai_roi
    ports:
      - "5433:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_roi -d ai_roi"]
      interval: 5s
      timeout: 5s
      retries: 20

  superset:
    image: apache/superset:6.1.0
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ai-roi-local-demo-secret-key-not-for-production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      ADMIN_EMAIL: admin@localhost
    volumes:
      - ./bootstrap.sh:/bootstrap/bootstrap.sh:ro
      - ./dashboard_export:/bootstrap/dashboard_export:ro
    depends_on:
      ai-roi-db:
        condition: service_healthy
    command: ["/bin/bash", "/bootstrap/bootstrap.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 180s
